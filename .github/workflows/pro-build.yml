name: Natural Fades Gunshot APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Download natural-fades source
        run: |
          rm -rf android-project
          mkdir -p android-project
          curl -fL --retry 3 "https://rhythmcore-admaker.floot.app/_cdn/static/4f0a71ce-ad89-447b-9b15-b5e515dbd2d8-RhythmCore-AdMaker-Android-v7.1.4-NATURAL-FADES-GUNSHOT-source.zip" -o /tmp/rc.zip
          unzip -o /tmp/rc.zip -d android-project
          test -f android-project/app/src/main/java/com/rhythmcoredj/admaker/MainActivity.kt

      - name: Build APK
        run: |
          cd android-project
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RhythmCore-AdMaker-Android-v7.1.4-NATURAL-FADES-GUNSHOT
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
