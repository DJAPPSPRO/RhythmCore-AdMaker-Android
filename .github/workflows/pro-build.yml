name: Mac Transition Match APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Download Mac transition-match source
        run: |
          rm -rf android-project
          mkdir -p android-project
          curl -fL --retry 3 "https://rhythmcore-admaker.floot.app/_cdn/static/b16a080a-c43c-4aca-9a61-465e9a121bfa-RhythmCore-AdMaker-Android-v7.0.9-MAC-TRANSITIONS-source-v2.zip" -o /tmp/macmatch.zip
          unzip -o /tmp/macmatch.zip -d android-project
          test -f android-project/app/src/main/java/com/rhythmcoredj/admaker/MainActivity.kt

      - name: Build APK
        run: |
          cd android-project
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RhythmCore-AdMaker-Android-v7.0.9-MAC-TRANSITIONS
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
