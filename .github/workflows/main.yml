name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Unpack Android project
        run: |
          rm -rf android-project
          mkdir -p android-project
          unzip -o RhythmCore-AdMaker-Android-v1.0.zip -d android-project
          echo "=== ZIP CONTENTS ==="
          find android-project -maxdepth 4 -type f | sort

      - name: Build APK
        run: |
          GRADLEW="$(find android-project -name gradlew -type f | head -n 1)"
          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew was not found inside the uploaded ZIP."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"
          echo "Project folder: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Locate APK
        if: always()
        run: |
          echo "=== APK FILES ==="
          find android-project -type f -name "*.apk" -print || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RhythmCore-AdMaker-APK
          path: android-project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
