name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Download professional rebuild source
        run: |
          rm -rf android-project
          mkdir -p android-project
          curl -fL --retry 3             "https://rhythmcore-admaker.floot.app/_cdn/static/10834307-b7a7-4fb5-b222-7bd39d6eed67-RhythmCore-AdMaker-ProRebuild-clean-v2.zip"             -o /tmp/RhythmCore-AdMaker-ProRebuild.zip
          unzip -o /tmp/RhythmCore-AdMaker-ProRebuild.zip -d android-project
          test -f android-project/app/src/main/res/drawable-nodpi/rhythmcore_graffiti.webp
          test -f android-project/app/src/main/java/com/rhythmcoredj/admaker/MainActivity.kt

      - name: Configure Java 17
        run: |
          APP_GRADLE="android-project/app/build.gradle.kts"
          cat >> "$APP_GRADLE" <<'EOF'

kotlin {
    jvmToolchain(17)
}

android {
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
}
EOF

      - name: Build APK
        run: |
          cd android-project
          gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RhythmCore-AdMaker-Pro-APK
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
