name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Unpack Android project
        run: |
          rm -rf android-project
          mkdir -p android-project
          unzip -o RhythmCore-AdMaker-Android-v1.0.zip -d android-project

      - name: Rebuild photo effects and vintage graffiti branding
        run: |
          PROJECT_DIR="$(find android-project -name settings.gradle.kts -type f -printf '%h\n' | head -n 1)"
          SOURCE="$PROJECT_DIR/app/src/main/java/com/rhythmcoredj/admaker/MainActivity.kt"
          python3 - "$SOURCE" <<'PY'
          import sys
          p = sys.argv[1]
          s = open(p, "r", encoding="utf-8").read()

          s = s.replace(
              'items += makeMediaItem(uri, slotMs, index)',
              'items += makeMediaItems(uri, slotMs, index)'
          )

          start = s.index("    private fun makeMediaItem(")
          end = s.index("    private fun buildStaticTitleSequence(", start)

          new_media = r'''    private fun makeMediaItems(uri: Uri, slotMs: Long, index: Int): List<EditedMediaItem> {
              val mime = contentResolver.getType(uri).orEmpty()
              return if (mime.startsWith("video/")) {
                  listOf(makeVideoItem(uri, slotMs))
              } else {
                  makePhotoFrames(uri, slotMs, index)
              }
          }

          private fun makeVideoItem(uri: Uri, slotMs: Long): EditedMediaItem {
              val media = MediaItem.Builder()
                  .setUri(uri)
                  .setClippingConfiguration(
                      MediaItem.ClippingConfiguration.Builder()
                          .setStartPositionMs(0)
                          .setEndPositionMs(slotMs)
                          .build()
                  )
                  .build()

              val effects = mutableListOf<Effect>()
              effects += Presentation.createForWidthAndHeight(
                  1080, 1920, Presentation.LAYOUT_SCALE_TO_FIT_WITH_CROP
              )
              effects += Contrast(0.18f)

              return EditedMediaItem.Builder(media)
                  .setFrameRate(30)
                  .setRemoveAudio(true)
                  .setEffects(Effects(ImmutableList.of(), ImmutableList.copyOf(effects)))
                  .build()
          }

          private fun makePhotoFrames(uri: Uri, slotMs: Long, index: Int): List<EditedMediaItem> {
              val effectId = Random.nextInt(25)
              val frameCount = when {
                  slotMs >= 1_400L -> 9
                  slotMs >= 900L -> 7
                  slotMs >= 550L -> 5
                  else -> 4
              }
              val perFrame = max(55L, slotMs / frameCount)
              val source = contentResolver.openInputStream(uri)?.use {
                  android.graphics.BitmapFactory.decodeStream(it)
              } ?: return emptyList()

              val result = mutableListOf<EditedMediaItem>()
              try {
                  for (frame in 0 until frameCount) {
                      val bmp = renderPhotoEffect(source, effectId, frame, frameCount, index)
                      val file = File(
                          cacheDir,
                          "rc_fx_${System.nanoTime()}_${index}_${effectId}_${frame}.jpg"
                      )
                      FileOutputStream(file).use {
                          bmp.compress(Bitmap.CompressFormat.JPEG, 94, it)
                      }
                      bmp.recycle()

                      val media = MediaItem.Builder()
                          .setUri(Uri.fromFile(file))
                          .setImageDurationMs(perFrame)
                          .build()

                      val fx = mutableListOf<Effect>()
                      fx += Presentation.createForWidthAndHeight(
                          1080, 1920, Presentation.LAYOUT_SCALE_TO_FIT
                      )

                      result += EditedMediaItem.Builder(media)
                          .setFrameRate(30)
                          .setRemoveAudio(true)
                          .setEffects(
                              Effects(
                                  ImmutableList.of(),
                                  ImmutableList.copyOf(fx)
                              )
                          )
                          .build()
                  }
              } finally {
                  source.recycle()
              }
              return result
          }

          private fun renderPhotoEffect(
              src: Bitmap,
              effectId: Int,
              frame: Int,
              frameCount: Int,
              index: Int
          ): Bitmap {
              val w = 1080
              val h = 1920
              val out = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
              val c = Canvas(out)
              c.drawColor(Color.BLACK)

              val progress = if (frameCount <= 1) 0f else frame.toFloat() / (frameCount - 1).toFloat()
              val pulse = kotlin.math.sin(progress * Math.PI).toFloat()
              val paint = Paint(Paint.ANTI_ALIAS_FLAG or Paint.FILTER_BITMAP_FLAG)

              val srcW = src.width.toFloat().coerceAtLeast(1f)
              val srcH = src.height.toFloat().coerceAtLeast(1f)
              val cover = max(w / srcW, h / srcH)

              var zoom = 1.0f
              var rotation = 0f
              var panX = 0f
              var panY = 0f

              when (effectId) {
                  0 -> zoom = 1.00f + 0.18f * progress
                  1 -> zoom = 1.20f - 0.18f * progress
                  2 -> { zoom = 1.08f; panX = -90f + 180f * progress }
                  3 -> { zoom = 1.08f; panX = 90f - 180f * progress }
                  4 -> { zoom = 1.08f; panY = -120f + 240f * progress }
                  5 -> { zoom = 1.08f; panY = 120f - 240f * progress }
                  6 -> { zoom = 1.10f + 0.08f * pulse; rotation = -3.2f + 6.4f * progress }
                  7 -> { zoom = 1.12f + 0.10f * pulse; rotation = 3.0f - 6.0f * progress }
                  8 -> zoom = if (frame % 2 == 0) 1.03f else 1.18f
                  9 -> { zoom = 1.16f; panX = if (frame % 2 == 0) -42f else 42f }
                  10 -> { zoom = 1.10f; rotation = if (frame % 2 == 0) -2.0f else 2.0f }
                  11 -> zoom = 1.03f + 0.24f * pulse
                  12 -> { zoom = 1.14f; panX = -70f + 140f * progress; rotation = -1.5f }
                  13 -> { zoom = 1.14f; panX = 70f - 140f * progress; rotation = 1.5f }
                  14 -> zoom = 1.06f + 0.12f * progress
                  15 -> zoom = 1.17f - 0.09f * progress
                  16 -> { zoom = 1.10f; panY = -70f + 140f * progress; rotation = 1.2f }
                  17 -> { zoom = 1.10f; panY = 70f - 140f * progress; rotation = -1.2f }
                  18 -> zoom = if (frame == frameCount / 2) 1.28f else 1.08f
                  19 -> { zoom = 1.12f; rotation = -4f + 8f * progress }
                  20 -> { zoom = 1.12f; rotation = 4f - 8f * progress }
                  21 -> { zoom = 1.06f + 0.10f * progress; panX = 55f * kotlin.math.sin(progress * 6.28f) }
                  22 -> { zoom = 1.08f + 0.10f * pulse; panY = 45f * kotlin.math.sin(progress * 9.42f) }
                  23 -> { zoom = 1.14f; panX = if (frame % 3 == 0) -65f else 25f; panY = if (frame % 2 == 0) 25f else -25f }
                  else -> { zoom = 1.08f + 0.14f * progress; rotation = -2.5f + 5f * progress }
              }

              val matrix = android.graphics.Matrix()
              val finalScale = cover * zoom
              matrix.postScale(finalScale, finalScale)
              val drawnW = srcW * finalScale
              val drawnH = srcH * finalScale
              matrix.postTranslate(
                  (w - drawnW) / 2f + panX,
                  (h - drawnH) / 2f + panY
              )
              if (rotation != 0f) {
                  matrix.postRotate(rotation, w / 2f, h / 2f)
              }

              val cm = android.graphics.ColorMatrix()
              when (effectId) {
                  0, 6, 11, 18 -> {
                      cm.setSaturation(0.72f)
                      val boost = android.graphics.ColorMatrix(
                          floatArrayOf(
                              1.24f,0f,0f,0f,-16f,
                              0f,1.24f,0f,0f,-16f,
                              0f,0f,1.24f,0f,-16f,
                              0f,0f,0f,1f,0f
                          )
                      )
                      cm.postConcat(boost)
                  }
                  1, 7, 12, 19 -> {
                      cm.setSaturation(0.08f)
                      val warm = android.graphics.ColorMatrix(
                          floatArrayOf(
                              1.14f,0f,0f,0f,12f,
                              0f,1.00f,0f,0f,4f,
                              0f,0f,0.78f,0f,-8f,
                              0f,0f,0f,1f,0f
                          )
                      )
                      cm.postConcat(warm)
                  }
                  2, 8, 13, 20 -> {
                      cm.setSaturation(1.45f)
                      val cyan = android.graphics.ColorMatrix(
                          floatArrayOf(
                              0.88f,0f,0f,0f,-2f,
                              0f,1.08f,0f,0f,4f,
                              0f,0f,1.28f,0f,8f,
                              0f,0f,0f,1f,0f
                          )
                      )
                      cm.postConcat(cyan)
                  }
                  3, 9, 14, 21 -> {
                      cm.setSaturation(1.55f)
                      val magenta = android.graphics.ColorMatrix(
                          floatArrayOf(
                              1.28f,0f,0f,0f,8f,
                              0f,0.86f,0f,0f,-4f,
                              0f,0f,1.18f,0f,6f,
                              0f,0f,0f,1f,0f
                          )
                      )
                      cm.postConcat(magenta)
                  }
                  4, 10, 15, 22 -> {
                      cm.setSaturation(0f)
                      val harsh = android.graphics.ColorMatrix(
                          floatArrayOf(
                              1.55f,0f,0f,0f,-52f,
                              0f,1.55f,0f,0f,-52f,
                              0f,0f,1.55f,0f,-52f,
                              0f,0f,0f,1f,0f
                          )
                      )
                      cm.postConcat(harsh)
                  }
                  else -> {
                      cm.setSaturation(0.92f)
                      val faded = android.graphics.ColorMatrix(
                          floatArrayOf(
                              1.12f,0f,0f,0f,8f,
                              0f,1.04f,0f,0f,3f,
                              0f,0f,0.90f,0f,-3f,
                              0f,0f,0f,1f,0f
                          )
                      )
                      cm.postConcat(faded)
                  }
              }
              paint.colorFilter = android.graphics.ColorMatrixColorFilter(cm)
              c.drawBitmap(src, matrix, paint)

              // Strong baked-in overlays so the effects remain visible after export.
              when (effectId) {
                  5, 14 -> drawFilmBurn(c, w, h, progress)
                  8, 23 -> drawGlitchSlices(c, src, matrix, frame, w, h)
                  9, 16 -> drawChromaticSplit(c, src, matrix, w, h)
                  10, 21 -> drawFlash(c, w, h, frame)
                  12, 17 -> drawScanLines(c, w, h, 34)
                  13, 22 -> drawHalftone(c, w, h, frame)
                  15, 20 -> drawFrameTear(c, w, h, frame)
                  18 -> drawPunchFrame(c, w, h, frame, frameCount)
                  19 -> drawVintageScratches(c, w, h, 80)
                  24 -> {
                      drawGlitchSlices(c, src, matrix, frame, w, h)
                      drawScanLines(c, w, h, 26)
                  }
              }

              drawFilmGrain(c, w, h, 520)
              drawVignette(c, w, h)
              return out
          }

          private fun drawFilmGrain(c: Canvas, w: Int, h: Int, count: Int) {
              val p = Paint()
              repeat(count) {
                  val v = Random.nextInt(70, 235)
                  p.color = Color.argb(Random.nextInt(18, 70), v, v, v)
                  val x = Random.nextInt(w).toFloat()
                  val y = Random.nextInt(h).toFloat()
                  val r = Random.nextInt(1, 5).toFloat()
                  c.drawCircle(x, y, r, p)
              }
          }

          private fun drawScanLines(c: Canvas, w: Int, h: Int, gap: Int) {
              val p = Paint().apply {
                  color = Color.argb(52, 0, 0, 0)
                  strokeWidth = 3f
              }
              var y = 0
              while (y < h) {
                  c.drawLine(0f, y.toFloat(), w.toFloat(), y.toFloat(), p)
                  y += gap
              }
          }

          private fun drawVintageScratches(c: Canvas, w: Int, h: Int, count: Int) {
              val p = Paint().apply { strokeWidth = 2f }
              repeat(count) {
                  p.color = Color.argb(Random.nextInt(25, 110), 245, 238, 220)
                  val x = Random.nextInt(w).toFloat()
                  c.drawLine(x, Random.nextInt(h).toFloat(), x + Random.nextInt(-10, 11), Random.nextInt(h).toFloat(), p)
              }
          }

          private fun drawFlash(c: Canvas, w: Int, h: Int, frame: Int) {
              if (frame % 2 == 0) {
                  val p = Paint().apply { color = Color.argb(92, 255, 255, 255) }
                  c.drawRect(0f, 0f, w.toFloat(), h.toFloat(), p)
              }
          }

          private fun drawFilmBurn(c: Canvas, w: Int, h: Int, progress: Float) {
              val x = (w * (0.15f + 0.7f * progress))
              val y = h * 0.45f
              val shader = android.graphics.RadialGradient(
                  x, y, h * 0.72f,
                  intArrayOf(
                      Color.argb(170, 255, 230, 110),
                      Color.argb(105, 255, 72, 24),
                      Color.argb(0, 0, 0, 0)
                  ),
                  floatArrayOf(0f, 0.38f, 1f),
                  android.graphics.Shader.TileMode.CLAMP
              )
              val p = Paint().apply { this.shader = shader }
              c.drawRect(0f, 0f, w.toFloat(), h.toFloat(), p)
          }

          private fun drawVignette(c: Canvas, w: Int, h: Int) {
              val shader = android.graphics.RadialGradient(
                  w / 2f, h / 2f, h * 0.72f,
                  intArrayOf(Color.TRANSPARENT, Color.argb(155, 0, 0, 0)),
                  floatArrayOf(0.46f, 1f),
                  android.graphics.Shader.TileMode.CLAMP
              )
              val p = Paint().apply { this.shader = shader }
              c.drawRect(0f, 0f, w.toFloat(), h.toFloat(), p)
          }

          private fun drawGlitchSlices(
              c: Canvas,
              src: Bitmap,
              matrix: android.graphics.Matrix,
              frame: Int,
              w: Int,
              h: Int
          ) {
              val p = Paint(Paint.ANTI_ALIAS_FLAG or Paint.FILTER_BITMAP_FLAG)
              repeat(7) { i ->
                  val top = Random.nextInt(h - 80)
                  val height = Random.nextInt(18, 72)
                  c.save()
                  c.clipRect(0, top, w, top + height)
                  c.translate((if ((i + frame) % 2 == 0) 1 else -1) * Random.nextInt(20, 75).toFloat(), 0f)
                  c.drawBitmap(src, matrix, p)
                  c.restore()
              }
              val bar = Paint()
              repeat(5) {
                  bar.color = if (it % 2 == 0) Color.argb(90, 210, 40, 230) else Color.argb(90, 20, 215, 220)
                  val y = Random.nextInt(h)
                  c.drawRect(0f, y.toFloat(), w.toFloat(), (y + Random.nextInt(5, 24)).toFloat(), bar)
              }
          }

          private fun drawChromaticSplit(
              c: Canvas,
              src: Bitmap,
              matrix: android.graphics.Matrix,
              w: Int,
              h: Int
          ) {
              val red = Paint(Paint.ANTI_ALIAS_FLAG or Paint.FILTER_BITMAP_FLAG).apply {
                  alpha = 70
                  colorFilter = android.graphics.PorterDuffColorFilter(
                      Color.rgb(255, 40, 80),
                      android.graphics.PorterDuff.Mode.MULTIPLY
                  )
              }
              val cyan = Paint(Paint.ANTI_ALIAS_FLAG or Paint.FILTER_BITMAP_FLAG).apply {
                  alpha = 70
                  colorFilter = android.graphics.PorterDuffColorFilter(
                      Color.rgb(30, 235, 245),
                      android.graphics.PorterDuff.Mode.MULTIPLY
                  )
              }
              c.save()
              c.translate(-16f, 0f)
              c.drawBitmap(src, matrix, red)
              c.restore()
              c.save()
              c.translate(16f, 0f)
              c.drawBitmap(src, matrix, cyan)
              c.restore()
          }

          private fun drawHalftone(c: Canvas, w: Int, h: Int, frame: Int) {
              val p = Paint().apply { color = Color.argb(70, 0, 0, 0) }
              val spacing = 34
              var y = 0
              while (y < h) {
                  var x = if ((y / spacing + frame) % 2 == 0) 0 else spacing / 2
                  while (x < w) {
                      c.drawCircle(x.toFloat(), y.toFloat(), 4f, p)
                      x += spacing
                  }
                  y += spacing
              }
          }

          private fun drawFrameTear(c: Canvas, w: Int, h: Int, frame: Int) {
              val p = Paint().apply { color = Color.argb(180, 245, 239, 220) }
              repeat(16) {
                  val y = Random.nextInt(h)
                  val width = Random.nextInt(10, 42)
                  c.drawRect(0f, y.toFloat(), width.toFloat(), (y + Random.nextInt(4, 28)).toFloat(), p)
                  c.drawRect((w - width).toFloat(), y.toFloat(), w.toFloat(), (y + Random.nextInt(4, 28)).toFloat(), p)
              }
          }

          private fun drawPunchFrame(c: Canvas, w: Int, h: Int, frame: Int, frameCount: Int) {
              if (frame == frameCount / 2) {
                  val p = Paint().apply {
                      style = Paint.Style.STROKE
                      strokeWidth = 34f
                      color = Color.argb(220, 255, 255, 255)
                  }
                  c.drawRect(24f, 24f, w - 24f, h - 24f, p)
              }
          }

          '''
          s = s[:start] + new_media + s[end:]

          seq0 = s.index("    private fun buildStaticTitleSequence(")
          save0 = s.index("    private fun saveToGallery()", seq0)

          new_branding = r'''    private fun buildStaticTitleSequence(
              text: String,
              totalMs: Long,
              intro: Boolean
          ): List<EditedMediaItem> {
              val count = 13
              val perFrame = max(80L, totalMs / count)
              return (0 until count).map { i ->
                  val bmp = makeTitleBitmap(i, intro)
                  val file = File(
                      cacheDir,
                      "rc_graffiti_${if (intro) "in" else "out"}_${System.nanoTime()}_$i.jpg"
                  )
                  FileOutputStream(file).use {
                      bmp.compress(Bitmap.CompressFormat.JPEG, 95, it)
                  }
                  bmp.recycle()

                  val media = MediaItem.Builder()
                      .setUri(Uri.fromFile(file))
                      .setImageDurationMs(perFrame)
                      .build()

                  val fx = mutableListOf<Effect>()
                  fx += Presentation.createForWidthAndHeight(
                      1080, 1920, Presentation.LAYOUT_SCALE_TO_FIT
                  )

                  EditedMediaItem.Builder(media)
                      .setFrameRate(30)
                      .setRemoveAudio(true)
                      .setEffects(
                          Effects(
                              ImmutableList.of(),
                              ImmutableList.copyOf(fx)
                          )
                      )
                      .build()
              }
          }

          private fun makeTitleBitmap(frame: Int, intro: Boolean): Bitmap {
              val w = 1080
              val h = 1920
              val bitmap = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888)
              val c = Canvas(bitmap)

              // Vintage brick / concrete wall.
              c.drawColor(Color.rgb(44, 38, 34))
              val brick = Paint()
              val mortar = Paint().apply {
                  color = Color.rgb(28, 25, 23)
                  strokeWidth = 8f
              }
              val bh = 115
              val bw = 255
              var row = 0
              var y = 0
              while (y < h) {
                  val offset = if (row % 2 == 0) 0 else -bw / 2
                  var x = offset
                  while (x < w) {
                      val shade = Random.nextInt(52, 92)
                      brick.color = Color.rgb(shade, shade - 8, shade - 16)
                      c.drawRect(
                          x.toFloat(),
                          y.toFloat(),
                          (x + bw - 8).toFloat(),
                          (y + bh - 8).toFloat(),
                          brick
                      )
                      x += bw
                  }
                  c.drawLine(0f, (y + bh).toFloat(), w.toFloat(), (y + bh).toFloat(), mortar)
                  y += bh
                  row++
              }

              // Old paper haze / grime.
              val haze = Paint()
              repeat(900) {
                  val v = Random.nextInt(95, 210)
                  haze.color = Color.argb(Random.nextInt(10, 46), v, v - 10, v - 24)
                  c.drawCircle(
                      Random.nextInt(w).toFloat(),
                      Random.nextInt(h).toFloat(),
                      Random.nextInt(2, 18).toFloat(),
                      haze
                  )
              }

              // Spray paint behind logo.
              val sprayColors = intArrayOf(
                  Color.rgb(183, 42, 210),
                  Color.rgb(20, 205, 215),
                  Color.rgb(232, 92, 28)
              )
              val spray = Paint()
              repeat(420) { i ->
                  val col = sprayColors[(i + frame) % sprayColors.size]
                  spray.color = Color.argb(
                      Random.nextInt(20, 95),
                      Color.red(col),
                      Color.green(col),
                      Color.blue(col)
                  )
                  val angle = Random.nextFloat() * 6.283f
                  val radius = Random.nextFloat() * 460f
                  val sx = w / 2f + kotlin.math.cos(angle) * radius
                  val sy = h / 2f + kotlin.math.sin(angle) * radius * 0.58f
                  c.drawCircle(sx, sy, Random.nextInt(2, 15).toFloat(), spray)
              }

              val jitterX = Random.nextInt(-20, 21).toFloat()
              val jitterY = Random.nextInt(-14, 15).toFloat()
              val cy = h / 2f + jitterY

              val graffiti = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  textAlign = Paint.Align.CENTER
                  typeface = Typeface.create("sans-serif-black", Typeface.BOLD_ITALIC)
                  textSkewX = -0.16f
                  fakeBoldText = true
                  letterSpacing = -0.02f
              }

              // Thick black spray outline.
              graffiti.style = Paint.Style.STROKE
              graffiti.strokeWidth = 34f
              graffiti.color = Color.rgb(8, 8, 8)
              graffiti.textSize = 178f
              c.drawText("RHYTHMCORE", w / 2f + jitterX, cy - 80f, graffiti)
              graffiti.textSize = 286f
              c.drawText("DJ", w / 2f + jitterX, cy + 205f, graffiti)

              // Cyan and purple offset graffiti shadows.
              graffiti.strokeWidth = 20f
              graffiti.color = Color.rgb(20, 205, 215)
              graffiti.textSize = 178f
              c.drawText("RHYTHMCORE", w / 2f + jitterX + 18f, cy - 70f, graffiti)
              graffiti.textSize = 286f
              c.drawText("DJ", w / 2f + jitterX + 18f, cy + 215f, graffiti)

              graffiti.color = Color.rgb(183, 42, 210)
              graffiti.textSize = 178f
              c.drawText("RHYTHMCORE", w / 2f + jitterX - 18f, cy - 90f, graffiti)
              graffiti.textSize = 286f
              c.drawText("DJ", w / 2f + jitterX - 18f, cy + 195f, graffiti)

              // Faded vintage fill.
              graffiti.style = Paint.Style.FILL
              graffiti.color = if (frame % 4 == 0) Color.rgb(231, 213, 176) else Color.rgb(239, 232, 213)
              graffiti.textSize = 178f
              c.drawText("RHYTHMCORE", w / 2f + jitterX, cy - 80f, graffiti)
              graffiti.textSize = 286f
              c.drawText("DJ", w / 2f + jitterX, cy + 205f, graffiti)

              // Paint drips under DJ.
              val drip = Paint().apply {
                  color = Color.rgb(183, 42, 210)
                  strokeWidth = 15f
                  strokeCap = Paint.Cap.ROUND
              }
              repeat(8) {
                  val x = w / 2f - 200f + it * 55f + Random.nextInt(-12, 13)
                  val len = Random.nextInt(35, 160)
                  c.drawLine(x, cy + 290f, x, cy + 290f + len, drip)
                  c.drawCircle(x, cy + 290f + len, 9f, drip)
              }

              // Vintage photocopy scratches and torn-poster stripes.
              val scratch = Paint()
              repeat(150) {
                  scratch.color = Color.argb(Random.nextInt(22, 90), 235, 223, 195)
                  val yy = Random.nextInt(h).toFloat()
                  c.drawRect(
                      Random.nextInt(-80, 180).toFloat(),
                      yy,
                      Random.nextInt(780, 1160).toFloat(),
                      yy + Random.nextInt(1, 7),
                      scratch
                  )
              }

              val sub = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.rgb(221, 210, 185)
                  textAlign = Paint.Align.CENTER
                  typeface = Typeface.create(Typeface.MONOSPACE, Typeface.BOLD)
                  textSize = 35f
                  letterSpacing = 0.14f
              }
              c.drawText(
                  if (intro) "URBAN • VINTAGE • RHYTHMCOREDJ" else "RHYTHMCOREDJ.COM",
                  w / 2f,
                  cy + 505f,
                  sub
              )

              // Analog static flash/glitch per frame.
              val static = Paint()
              repeat(90) {
                  val vv = Random.nextInt(110, 245)
                  static.color = Color.argb(Random.nextInt(18, 85), vv, vv, vv)
                  val yy = Random.nextInt(h)
                  c.drawRect(0f, yy.toFloat(), w.toFloat(), (yy + Random.nextInt(1, 5)).toFloat(), static)
              }
              if (frame % 5 == 0) {
                  static.color = Color.argb(72, 255, 255, 255)
                  c.drawRect(0f, 0f, w.toFloat(), h.toFloat(), static)
              }

              drawVignette(c, w, h)
              return bitmap
          }

          '''
          s = s[:seq0] + new_branding + s[save0:]

          open(p, "w", encoding="utf-8").write(s)
          PY

      - name: Fix JVM target
        run: |
          PROJECT_DIR="$(find android-project -name settings.gradle.kts -type f -printf '%h\n' | head -n 1)"
          APP_GRADLE="$PROJECT_DIR/app/build.gradle.kts"
          printf '\n%s\n' 'kotlin {' '    jvmToolchain(17)' '}' '' 'android {' '    compileOptions {' '        sourceCompatibility = JavaVersion.VERSION_17' '        targetCompatibility = JavaVersion.VERSION_17' '    }' '}' >> "$APP_GRADLE"

      - name: Build APK
        run: |
          PROJECT_DIR="$(find android-project -name settings.gradle.kts -type f -printf '%h\n' | head -n 1)"
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Locate APK
        if: always()
        run: |
          find android-project -type f -name "*.apk" -print || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RhythmCore-AdMaker-APK
          path: android-project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
