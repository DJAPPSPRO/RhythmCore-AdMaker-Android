name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Unpack Android project
        run: |
          rm -rf android-project
          mkdir -p android-project
          unzip -o RhythmCore-AdMaker-Android-v1.0.zip -d android-project

      - name: Inspect renderer source
        run: |
          PROJECT_DIR="$(find android-project -name settings.gradle.kts -type f -printf '%h\n' | head -n 1)"
          SOURCE="$PROJECT_DIR/app/src/main/java/com/rhythmcoredj/admaker/MainActivity.kt"
          echo "=== SOURCE 250-390 ==="
          sed -n '250,390p' "$SOURCE"
          echo "=== SOURCE 390-520 ==="
          sed -n '390,520p' "$SOURCE"

      - name: Fix JVM target
        run: |
          PROJECT_DIR="$(find android-project -name settings.gradle.kts -type f -printf '%h\n' | head -n 1)"
          APP_GRADLE="$PROJECT_DIR/app/build.gradle.kts"
          printf '\n%s\n' 'kotlin {' '    jvmToolchain(17)' '}' '' 'android {' '    compileOptions {' '        sourceCompatibility = JavaVersion.VERSION_17' '        targetCompatibility = JavaVersion.VERSION_17' '    }' '}' >> "$APP_GRADLE"
          echo "=== PATCHED app/build.gradle.kts ==="
          cat "$APP_GRADLE"

      - name: Fix Media3 effect generic
        run: |
          PROJECT_DIR="$(find android-project -name settings.gradle.kts -type f -printf '%h\n' | head -n 1)"
          SOURCE="$PROJECT_DIR/app/src/main/java/com/rhythmcoredj/admaker/MainActivity.kt"
          sed -i '342s/ImmutableList.of(/ImmutableList.of<Effect>(/' "$SOURCE"
          sed -n '338,346p' "$SOURCE"

      - name: Build APK
        run: |
          PROJECT_DIR="$(find android-project -name settings.gradle.kts -type f -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project root was not found."
            exit 1
          fi
          cd "$PROJECT_DIR"
          gradle assembleDebug --stacktrace

      - name: Locate APK
        if: always()
        run: |
          echo "=== APK FILES ==="
          find android-project -type f -name "*.apk" -print || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RhythmCore-AdMaker-APK
          path: android-project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
