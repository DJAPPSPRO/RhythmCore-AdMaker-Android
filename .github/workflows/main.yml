name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Unpack Android project
        run: |
          rm -rf android-project
          mkdir -p android-project
          unzip -o RhythmCore-AdMaker-Android-v1.0.zip -d android-project
          echo "=== PROJECT FILES ==="
          find android-project -maxdepth 4 -type f | sort

      - name: Build APK
        run: |
          PROJECT_DIR="$(find android-project -name settings.gradle.kts -type f -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Android project root was not found."
            exit 1
          fi
          echo "Project folder: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle --version
          gradle assembleDebug --stacktrace

      - name: Locate APK
        if: always()
        run: |
          echo "=== APK FILES ==="
          find android-project -type f -name "*.apk" -print || true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RhythmCore-AdMaker-APK
          path: android-project/**/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
